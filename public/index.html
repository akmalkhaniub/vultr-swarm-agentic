<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VultrSwarm-Agentic</title>
<style>
:root{--bg:#0b1020;--card:#131a2e;--border:#24304d;--text:#e6ebf5;--dim:#8a97b5;--accent:#007BFF;--good:#10b981;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 28px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:19px}.sub{color:var(--dim);font-size:12.5px}
main{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:14px}
.kpi .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}.kpi .v{font-size:24px;font-weight:800;font-family:monospace;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}.tag{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);color:var(--dim)}
.row{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}.row:last-child{border:0}
pre{background:#070b16;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11.5px;max-height:320px;overflow:auto}
.notice{font-size:12px;color:var(--warn);margin-top:8px}
</style></head><body>
<header><div><h1>VultrSwarm-Agentic</h1><div class="sub">Autonomous CloudOps swarm · Vultr</div></div><span class="tag" id="health">checking…</span></header>
<main>
  <div class="grid" id="kpis"></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
    <strong>Run autonomous CloudOps audit</strong><button id="run">▶ Run</button></div>
    <div class="notice">⚠ Demo mode: Vultr inventory is currently mocked (src/vultr_tools.ts). Wire to the Vultr API with VULTR_API_KEY before submission.</div>
  </div>
  <div class="card"><strong>Steps</strong><div id="steps" style="margin-top:8px"></div></div>
  <div class="card"><strong>Raw result</strong><pre id="raw">Click Run to execute.</pre></div>
</main>
<script>
const $=id=>document.getElementById(id);
fetch('/api/health').then(r=>r.json()).then(h=>$('health').textContent='● '+h.status).catch(()=>$('health').textContent='offline');
function kpis(items){$('kpis').innerHTML=items.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}
kpis([["Nodes scanned","—"],["Findings","—"],["Auto-remediated","—"],["API latency (ms)","—"]]);
$('run').onclick=async()=>{
  $('run').disabled=true;$('raw').textContent='Running…';
  try{const r=await fetch('/api/run',{method:'POST'});const d=await r.json();
    $('raw').textContent=JSON.stringify(d,null,2);
    const res=d.result;kpis([["Nodes scanned",res.nodesScanned],["Findings",res.findings.length],["Auto-remediated",res.findings.filter(f=>f.applied).length],["API latency (ms)",d.latencyMs]]);
    $('steps').innerHTML=res.findings.length?res.findings.map(f=>`<div class="row"><b>[${f.severity}]</b> ${f.resourceId}: ${f.issue}<br/>→ ${f.remediationAction}</div>`).join(''):'<div class="row">All nodes healthy.</div>';
  }catch(e){$('raw').textContent='Error: '+e.message}
  $('run').disabled=false;
};
</script></body></html>
